<style>*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}body{background:#f5f7fa;padding:1rem;max-width:800px;margin:0 auto;color:#333}h1{text-align:center;color:#1a1a2e;font-size:1.8rem;margin-bottom:0.3rem;font-weight:700}.subtitle{text-align:center;color:#555;font-size:.9rem;margin:0}.card{background:#fff;border-radius:12px;padding:1rem;margin-bottom:1rem;border:1px solid #e8e8e8;font-size:.82rem;color:#555;line-height:1.7}.tab-row{display:flex;justify-content:center;gap:0.5rem;margin-bottom:1rem}.tab{padding:0.6rem 1.5rem;border-radius:25px;border:2px solid #ddd;background:#fff;font-size:.95rem;font-weight:500;cursor:pointer}.tab.active{border-color:#667eea;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-weight:600}.ig{display:grid;grid-template-columns:32px 1fr 70px;gap:0.4rem;margin-bottom:0.35rem;align-items:center}.ig span{font-size:.8rem;color:#999;text-align:center}.ig input{padding:0.4rem 0.6rem;border:1px solid #ddd;border-radius:6px;font-size:.9rem;outline:none;min-width:0}.ig input:focus{border-color:#667eea}.btn{padding:0.35rem 0.8rem;border:none;border-radius:6px;cursor:pointer;font-size:.8rem;font-weight:500}.ba{background:#4CAF50;color:#fff}.bd{background:#ff5252;color:#fff}.br{background:#2d8cf0;color:#fff}.bg{padding:0.6rem 1.5rem;border-radius:8px;border:none;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-weight:600;font-size:1rem;cursor:pointer}.bgr{padding:0.6rem 1.5rem;border-radius:8px;border:none;background:linear-gradient(135deg,#f093fb,#f5576c);color:#fff;font-weight:600;font-size:1rem;cursor:pointer}.bga{padding:0.6rem 1.5rem;border-radius:8px;border:none;background:linear-gradient(135deg,#f2994a,#f2c94c);color:#fff;font-weight:600;font-size:.95rem;cursor:pointer}.brow{display:flex;gap:0.5rem;margin:0.5rem 0;flex-wrap:wrap}.mc{background:#fff;border-radius:10px;padding:1rem;margin:0.8rem 0;border:1px solid #eee;box-shadow:0 2px 8px rgba(0,0,0,.06)}.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.6rem}.rl{font-weight:700;font-size:.95rem;color:#1a1a2e}.db{font-size:.75rem;padding:0.2rem 0.5rem;border-radius:12px;font-weight:500}.d0{background:#d4edda;color:#155724}.d1{background:#fff3cd;color:#856404}.d2{background:#ffeeba;color:#856404}.dx{background:#f8d7da;color:#721c24}.vs{text-align:center;font-weight:700;color:#ff6b6b;margin:0.3rem 0;font-size:.85rem}.tr{text-align:center;font-size:.95rem;display:flex;justify-content:center;align-items:center;gap:0.5rem;flex-wrap:wrap}.ss{margin-top:1.5rem;background:#f8f9fa;border-radius:10px;padding:1rem;overflow-x:auto}.ss table{width:100%;border-collapse:collapse;font-size:.8rem}.ss th{background:#e8f3ff;padding:0.5rem 0.4rem;border:1px solid #ddd;white-space:nowrap;font-weight:600;text-align:center}.ss td{padding:0.4rem;border:1px solid #eee;text-align:center;white-space:nowrap}.ss td.dt{white-space:normal;text-align:left;font-size:.72rem;max-width:180px;word-break:break-all}.hint{font-size:.75rem;color:#aaa;margin-top:0.3rem}.trow{display:flex;gap:1rem;flex-wrap:wrap}.tba{flex:1 1 280px;background:#f0f4ff;border-radius:12px;padding:1rem;border:1px solid #d0d8f0}.tbb{flex:1 1 280px;background:#fff0f0;border-radius:12px;padding:1rem;border:1px solid #f0d0d0}.tbm{background:#f0fff4;border-radius:12px;padding:1rem;border:1px solid #c3e6cb}.st{font-size:1.1rem;font-weight:600;margin-bottom:0.5rem;color:#1a1a2e}.hidden{display:none}.cr{display:flex;gap:1rem;align-items:center;margin:1rem 0;flex-wrap:wrap}.ri{padding:0.5rem;border-radius:6px;border:1px solid #ddd;width:80px;font-size:.9rem}.ai{padding:0.5rem;border-radius:6px;border:1px solid #ddd;width:60px;font-size:.9rem}.ds{padding:0.5rem;border-radius:6px;border:1px solid #ddd;font-size:.9rem;background:#fff}.btnrow2{display:flex;gap:10px;margin:0.8rem 0;flex-wrap:wrap}.appendrow{display:flex;gap:0.5rem;align-items:center;margin:0.8rem 0;flex-wrap:wrap}.hbanner{position:relative;border-radius:16px;overflow:hidden;margin-bottom:1.5rem;padding:2rem 1rem 1.5rem;text-align:center;background:linear-gradient(135deg,#87CEEB 0%,#b3e0f2 30%,#f0f8ff 50%,#e8f5e9 70%,#c8e6c9 100%)}.hbanner::after{content:'';position:absolute;bottom:0;left:0;right:0;height:40%;background:linear-gradient(0deg,rgba(255,193,7,.15) 0%,rgba(76,175,80,.1) 40%,transparent 100%);pointer-events:none}.hbanner h1,.hbanner p{position:relative;z-index:1}.hdl{position:absolute;bottom:10px;left:10px;font-size:2.5rem;opacity:.3}.hdr{position:absolute;top:10px;right:15px;font-size:2rem;opacity:.3}
.sc-row{display:flex;align-items:center;gap:0.5rem;margin-top:0.6rem;padding:0.5rem 0.8rem;background:#f8f9fa;border-radius:8px;justify-content:center;flex-wrap:wrap}.sc-inp{width:50px;padding:0.4rem;border-radius:6px;border:1px solid #ddd;font-size:.95rem;text-align:center;font-weight:600}.sc-vs{font-weight:700;color:#999;font-size:.8rem}.sc-btn{padding:0.4rem 1rem;border-radius:6px;border:none;background:#4CAF50;color:#fff;font-size:.8rem;font-weight:600;cursor:pointer}.sc-edit{padding:0.4rem 1rem;border-radius:6px;border:none;background:#e0e0e0;color:#666;font-size:.8rem;font-weight:500;cursor:pointer}.sc-confirmed{font-weight:700;font-size:1.1rem}.sc-win{color:#4CAF50}.sc-lose{color:#ff5252}
.rk-section{margin-top:2rem;border-radius:12px;overflow:hidden;border:1px solid #e8e8e8;background:#fff}.rk-title{padding:1rem;background:linear-gradient(135deg,#f8f9fa,#e8f3ff);font-weight:700;font-size:1.1rem;color:#1a1a2e;border-bottom:1px solid #e8e8e8;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:0.5rem}.rk-toggle{display:flex;gap:0.3rem}.rk-tbtn{padding:0.3rem 0.7rem;border-radius:14px;border:1px solid #ddd;background:#fff;cursor:pointer;font-size:.78rem;font-weight:500}.rk-tbtn.active{border-color:#667eea;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-weight:600}.rk-hdr{display:flex;align-items:center;padding:0.5rem 1rem;border-bottom:1px solid #f0f0f0;gap:0.8rem}.rk-hdr-ph{width:40px;flex-shrink:0}.rk-hdr-nm{flex:1}.rk-hdr-st{text-align:center;min-width:70px;font-size:.75rem;color:#999;font-weight:600}.rk-row{display:flex;align-items:center;padding:1rem;border-bottom:1px solid #f0f0f0;gap:0.8rem}.rk-medal{font-size:2rem;width:40px;text-align:center;flex-shrink:0}.rk-flag{font-size:1.2rem;flex-shrink:0}.rk-name{font-weight:700;font-size:1.1rem;flex:1}.rk-val{text-align:center;min-width:70px;font-weight:700;font-size:1rem}.rk-pos{color:#4CAF50}.rk-neg{color:#ff5252}.rk-psec{margin:1rem;border-radius:10px;border:1px solid #f0f0f0;overflow:hidden}.rk-ptitle{padding:0.7rem 1rem;background:#f8f9fa;font-weight:600;font-size:.95rem;color:#333;border-bottom:1px solid #eee}.rk-phdr{display:flex;align-items:center;padding:0.4rem 1rem;border-bottom:1px solid #f0f0f0;gap:0.8rem}.rk-phdr-rk{width:32px;flex-shrink:0}.rk-phdr-nm{flex:1}.rk-prow{display:flex;align-items:center;padding:0.7rem 1rem;border-bottom:1px solid #f5f5f5;gap:0.8rem}.rk-prk{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;color:#fff;flex-shrink:0}.rk-pnm{flex:1;font-weight:600;font-size:.95rem}.rk-pval{text-align:center;min-width:70px;font-weight:700;font-size:.9rem}
</style></head><body>
<div class="hbanner"><span class="hdl">🏸</span><span class="hdr">🏆</span><h1>🏸 羽排大师</h1><p class="subtitle">智能排阵 · 公平对战 · 一键生成（单机版）</p></div>
<div class="tab-row"><button class="tab active" id="t1" onclick="sw('team')">⚔️ 双队对战</button><button class="tab" id="t2" onclick="sw('mixed')">🔀 单组混战</button></div>
<div class="card" id="rul"></div>
<div id="tp"><div class="trow"><div class="tba"><div class="st">🔵 A队选手</div><div id="sA"></div><div class="brow"><button class="btn ba" onclick="ar('A')">+ 加一行</button><button class="btn bd" onclick="dr('A')">- 减一行</button><button class="btn br" onclick="fr('A')">🎲 随机填满</button></div><div class="hint">💡 排名数字越小越强（1=最强）；留空的行自动跳过</div></div><div class="tbb"><div class="st">🔴 B队选手</div><div id="sB"></div><div class="brow"><button class="btn ba" onclick="ar('B')">+ 加一行</button><button class="btn bd" onclick="dr('B')">- 减一行</button><button class="btn br" onclick="fr('B')">🎲 随机填满</button></div><div class="hint">💡 排名数字越小越强（1=最强）；留空的行自动跳过</div></div></div></div>
<div id="mp" class="hidden"><div class="tbm"><div class="st">🏸 全体选手</div><div id="sAll"></div><div class="brow"><button class="btn ba" onclick="ar('All')">+ 加一行</button><button class="btn bd" onclick="dr('All')">- 减一行</button><button class="btn br" onclick="fr('All')">🎲 随机填满</button></div><div class="hint">💡 排名数字越小越强（1=最强）；留空的行自动跳过</div></div></div>
<div class="cr"><span style="font-size:.9rem">比赛场数:</span><input class="ri" type="number" id="rds" value="45" min="1"><span style="font-size:.9rem">实力差≤</span><select class="ds" id="mds"><option value="2">≤ 2</option><option value="3">≤ 3</option><option value="4">≤ 4</option><option value="5">≤ 5</option><option value="6">≤ 6</option><option value="7">≤ 7</option><option value="8">≤ 8</option><option value="9">≤ 9</option><option value="10">≤ 10</option></select></div>
<div class="btnrow2"><button class="bg" onclick="gen()">🎯 生成对阵表</button><button class="bgr" onclick="genR()">🎲 全部随机</button></div>
<div id="apd" class="appendrow hidden"><span style="font-size:.9rem">追加:</span><input class="ai" type="number" id="apc" value="1" min="1"><span style="font-size:.9rem">场</span><button class="bga" onclick="apnd()">➕ 追加场次</button></div>
<div id="mr"></div><div id="st"></div><div id="rk"></div>
<div style="text-align:center;margin-top:2rem;padding-top:1rem;border-top:1px solid #e8e8e8;font-size:.8rem;color:#aaa">作者：Sam Peng</div>
<script>
var M='team',SN='赵钱孙李周吴郑王冯陈褚卫蒋沈韩杨朱秦尤许何吕施张孔曹严华金魏陶姜',GN='伟芳敏静丽强磊洋勇艳杰娟涛超明霞秀桂英华慧建国平刚辉鑫鹏飞翔宇';var CMS=[],CTA=null,CTB=null,CPL=null,CSC=[],RKM='netScore';function gMD(){return parseInt(document.getElementById('mds').value)||2;}function sw(m){M=m;document.getElementById('t1').className='tab'+(m==='team'?' active':'');document.getElementById('t2').className='tab'+(m==='mixed'?' active':'');document.getElementById('tp').className=m==='team'?'':'hidden';document.getElementById('mp').className=m==='mixed'?'':'hidden';CMS=[];CSC=[];document.getElementById('apd').className='appendrow hidden';document.getElementById('mr').innerHTML='';document.getElementById('st').innerHTML='';document.getElementById('rk').innerHTML='';ur();}function ur(){document.getElementById('rul').innerHTML='<b>📐 排阵规则：</b><br>🎯 实力均衡：双方组合排名总和差可控（默认≤2，支持调整≤3~10，或全部随机）<br>✅ 出场铁律：每人出场次数差 ≤ 1，绝对公平<br>🚫 禁连打：同一人不连续上场，优先休息<br>🤝 搭档全覆盖：尽量让所有人都互相搭档过<br>⚔️ 对手全覆盖：尽量让所有人都互相交手过<br>⚖️ 对手均衡：每人面对各对手的次数尽量均匀<br>➕ 支持随时追加场次，新场次继承已有统计';}function sh(i){return '<div class="ig"><span>'+i+'</span><input placeholder="选手'+i+'"><input type="number" placeholder="1=最强" min="1" max="99" style="text-align:center"></div>';}function is(id,n){var c=document.getElementById(id);c.innerHTML='';for(var i=1;i<=n;i++)c.innerHTML+=sh(i);}function ar(t){var c=document.getElementById('s'+t),n=c.children.length+1;c.innerHTML+=sh(n);}function dr(t){var c=document.getElementById('s'+t);if(c.children.length>1)c.removeChild(c.lastChild);}function rn(u){for(var i=0;i<100;i++){var s=SN[Math.floor(Math.random()*SN.length)]+GN[Math.floor(Math.random()*GN.length)]+(Math.random()>.5?GN[Math.floor(Math.random()*GN.length)]:'');if(!u.has(s)){u.add(s);return s;}}return'P'+Math.floor(Math.random()*999);}function fr(t){var c=document.getElementById('s'+t),rows=c.children,u=new Set();for(var i=0;i<rows.length;i++){var inp=rows[i].querySelectorAll('input');inp[0].value=rn(u);inp[1].value=String(i+1);}}function pp(t){var c=document.getElementById('s'+t),rows=c.children,l=[];for(var i=0;i<rows.length;i++){var inp=rows[i].querySelectorAll('input');var nm=inp[0].value.trim(),sc=parseInt(inp[1].value);if(nm&&!isNaN(sc)&&sc>=1)l.push({name:nm,score:sc,play:0,maxPlay:0,partners:new Set(),opponents:new Set()});}return l.sort(function(a,b){return a.score-b.score;});}function gk(a,b){return a<b?a+'|'+b:b+'|'+a;}function gen(){CMS=[];CSC=[];document.getElementById('mr').innerHTML='';document.getElementById('st').innerHTML='';document.getElementById('rk').innerHTML='';document.getElementById('apd').className='appendrow hidden';var r=parseInt(document.getElementById('rds').value)||45;var md=gMD();if(M==='team')gt(r,md);else gm(r,md);}function genR(){CMS=[];CSC=[];document.getElementById('mr').innerHTML='';document.getElementById('st').innerHTML='';document.getElementById('rk').innerHTML='';document.getElementById('apd').className='appendrow hidden';var r=parseInt(document.getElementById('rds').value)||45;if(M==='team')gt(r,9999);else gm(r,9999);}function apnd(){var cnt=parseInt(document.getElementById('apc').value)||1;var md=gMD();if(M==='team')at(cnt,md);else am(cnt,md);}function confirmScore(idx){var s1=parseInt(document.getElementById('si1_'+idx).value)||0;var s2=parseInt(document.getElementById('si2_'+idx).value)||0;CSC[idx]={s1:s1,s2:s2,confirmed:true};renderScoreUI(idx);renderRanking();}function editScore(idx){var s=CSC[idx];var p1=s?s.s1:'',p2=s?s.s2:'';CSC[idx]={s1:0,s2:0,confirmed:false};renderScoreUI(idx,p1,p2);renderRanking();}function renderScoreUI(idx,p1,p2){var el=document.getElementById('sc_'+idx);if(!el)return;var s=CSC[idx];if(s&&s.confirmed){var w1=s.s1>s.s2,w2=s.s2>s.s1;el.innerHTML='<span class="sc-confirmed '+(w1?'sc-win':'sc-lose')+'">'+s.s1+'</span><span class="sc-vs">:</span><span class="sc-confirmed '+(w2?'sc-win':'sc-lose')+'">'+s.s2+'</span><button class="sc-edit" onclick="editScore('+idx+')">✏️ 修改</button>';}else{var v1=p1!==undefined?p1:'';var v2=p2!==undefined?p2:'';el.innerHTML='<input class="sc-inp" type="number"
